<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE4EC"/>
      <stop offset="1" stop-color="#FBC7D8"/>
    </linearGradient>
    <path id="p" d="M0,0 C-8,-6 -8,-16 -1,-18 L0,-15 L1,-18 C8,-16 8,-6 0,0Z" fill="#F7A8C4" opacity="0.9"/>
    <style>
      .f { transform-box: fill-box; transform-origin: center; animation: fall linear infinite; }
      @keyframes fall {
        0%   { transform: translate(0,-30px) rotate(0deg); }
        50%  { transform: translate(30px,140px) rotate(180deg); }
        100% { transform: translate(-10px,300px) rotate(360deg); }
      }
    </style>
  </defs>

  <rect width="800" height="260" fill="url(#bg)"/>

  <use href="#p" class="f" x="60"  style="animation-duration:7s;animation-delay:0s"/>
  <use href="#p" class="f" x="150" style="animation-duration:9s;animation-delay:-3s"/>
  <use href="#p" class="f" x="240" style="animation-duration:6s;animation-delay:-1s"/>
  <use href="#p" class="f" x="330" style="animation-duration:8s;animation-delay:-5s"/>
  <use href="#p" class="f" x="420" style="animation-duration:7s;animation-delay:-2s"/>
  <use href="#p" class="f" x="510" style="animation-duration:10s;animation-delay:-6s"/>
  <use href="#p" class="f" x="600" style="animation-duration:6.5s;animation-delay:-4s"/>
  <use href="#p" class="f" x="690" style="animation-duration:8.5s;animation-delay:-1.5s"/>
  <use href="#p" class="f" x="740" style="animation-duration:7.5s;animation-delay:-5s"/>
  <use href="#p" class="f" x="25"  style="animation-duration:9.5s;animation-delay:-7s"/>

  <text x="400" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="38" fill="#C2577F">Reviana Fitri 🌸</text>
  <text x="400" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#9C6B7E">Information Systems Student</text>
</svg>
